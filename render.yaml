# Render Blueprint for the detection backend (free plan).
#   api.gvisionai.tech -> FastAPI + ONNX models in Docker (sleeps after ~15 min idle)
# The frontend is hosted on GitHub Pages (https://gvisionai.tech); see scripts/deploy-pages.sh.
services:
  - type: web
    name: gesturevision-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        value: '["https://gvisionai.tech","https://www.gvisionai.tech","http://gvisionai.tech","http://localhost:5173"]'
      - key: MAX_DETECTION_FPS
        value: "5"
      - key: MAX_VIDEO_SIZE_MB
        value: "100"
    domains:
      - api.gvisionai.tech
